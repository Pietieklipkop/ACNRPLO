<!doctype html>
<html lang="en" data-theme="light" class="w-full max-w-full overflow-x-hidden">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="text-scale" content="scale" />

		<!-- PWA Primary Colors & Branding -->
		<meta name="theme-color" content="#2D4733" />
		<meta name="application-name" content="ACNRPLO" />
		<meta name="description" content="Atherstone Collaborative Nature Reserve — Private Land Owners Platform" />

		<!-- Apple & Android Web App Configurations -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ACNRPLO" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

		<!-- Manifest & Favicons -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="viewport" class="w-full max-w-full overflow-x-hidden min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
